<!doctype html>
<meta charset="utf-8">
<title>Approval</title>
<style>
  body{font:15px system-ui;max-width:900px;margin:2rem auto;display:grid;grid-template-columns:1fr 1fr;gap:2rem}
  .card{border:1px solid #888;padding:1rem;border-radius:8px;margin-bottom:1rem}
  .untrusted{background:#f3f3f3;border-left:4px solid #c90;padding:.4rem;font-style:italic}
  .observed{color:#111}.reported{color:#888}.gold{color:#b8860b;font-weight:700}.blocked{color:#b00020}
  button{margin-right:.5rem}
</style>
<h2 style="grid-column:1/3">Approval <small id="key-note"></small></h2>
<section><h3>Pending</h3><div id="pending"></div><div id="approved"></div></section>
<section><h3>Ledger <small id="chain"></small></h3><div id="ledger"></div></section>
<script src="/app.js"></script>
